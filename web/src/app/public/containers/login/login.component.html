<app-auth-layout heading="Sign in" subheading="Pick up your conversations where you left them.">
  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
    @if (serverError) {
      <div class="form-alert" role="alert">
        <app-icon name="alert-circle" />
        <span>{{ serverError }}</span>
      </div>
    }

    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" class="input" type="email" formControlName="email"
        autocomplete="email" placeholder="you@example.com" [class.invalid]="showError(email)"
        [attr.aria-invalid]="showError(email)" aria-describedby="login-email-error" />
      @if (showError(email)) {
        <p class="field-error" id="login-email-error">
          <app-icon name="alert-circle" />
          {{ email.hasError('required') ? 'Enter your email address.' : 'Enter a valid email, like you@example.com.' }}
        </p>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <div class="input-wrap">
        <input id="login-password" class="input" [type]="showPassword ? 'text' : 'password'"
          formControlName="password" autocomplete="current-password" [class.invalid]="showError(password)"
          [attr.aria-invalid]="showError(password)" aria-describedby="login-password-error" />
        <button type="button" class="icon-btn" (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword">
          <app-icon [name]="showPassword ? 'eye-off' : 'eye'" />
        </button>
      </div>
      @if (showError(password)) {
        <p class="field-error" id="login-password-error">
          <app-icon name="alert-circle" />
          Enter your password.
        </p>
      }
    </div>

    <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting">
      @if (submitting) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-switch">New here? <a [routerLink]="['/public/register']">Create an account</a></p>
</app-auth-layout>
