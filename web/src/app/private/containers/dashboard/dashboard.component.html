<div class="shell" [class.detail-open]="detailOpen()"
    [class.empty-start]="loaded() && chats().length === 0 && !detailOpen()" [class.searching]="searching()">
    <aside class="sidebar" aria-label="Chats">
      <header class="side-head">
        <div class="brand">
          <app-logo />
          <span>Huginn</span>
        </div>
        <button type="button" class="new-room" (click)="openCreate()" [class.active]="creating()"
          [attr.aria-pressed]="creating()">
          <app-icon name="users" />
          <span>New group</span>
        </button>
      </header>
      <app-chat-search [chats]="chats()" [me]="user()" [onlineIds]="onlineIds()" (activeChange)="searching.set($event)"
      (openChat)="selectChat($event)" (openPerson)="openPerson($event)" />
      <app-chat-list [hidden]="searching()" [me]="user()" [selectedChatId]="selectedChatId()" [onlineIds]="onlineIds()"
        (open)="selectChat($event)" (closeSelected)="closeChat()" />
      <footer class="me">
        <button type="button" class="me-button" (click)="openProfileEditor()" [class.active]="editingProfile()"
          aria-label="Edit your profile" title="Edit your profile">
          <app-avatar [user]="user()" size="sm" [online]="connection() === 'online'" />
          <span class="who">
            <span class="username">{{ user() | displayName }}</span>
            <span class="status" [attr.data-state]="connection()" role="status">
              {{ connection() === 'online' ? 'Online' : connection() === 'connecting' ? 'Connecting…' : 'Offline, retrying' }}
            </span>
          </span>
        </button>
        <button type="button" class="icon-btn" (click)="logout()" aria-label="Sign out" title="Sign out">
          <app-icon name="log-out" />
        </button>
      </footer>
    </aside>
    <main class="detail">
      @if (editingProfile()) {
        <app-profile-edit [me]="user()" (saved)="onProfileSaved($event)" (close)="closeProfileEditor()" />
      }
      @if (creating() && !editingProfile()) {
        <app-create-room [me]="user()" [onlineIds]="onlineIds()"
          (created)="onCreated($event)" (cancel)="closeCreate()" />
      }
      @if (!creating() && !editingProfile() && openChat(); as chat) {
        <app-chat-room [chat]="chat" [me]="user()"
          [onlineIds]="onlineIds()" [connection]="connection()" (back)="closeChat()"
          (openProfile)="openProfile($event)" />
      }
      @if (!creating() && !editingProfile() && !openChat()) {
        <app-start-chat [me]="user()" [hasRooms]="chats().length > 0"
        [onlineIds]="onlineIds()" (pick)="openPerson($event)" />
      }
      @if (profileUser(); as person) {
        <app-profile-panel [person]="person" [me]="user()"
          [online]="onlineIds().has(person.Id!) || !!person.online" [inChatWith]="isChatWith(person)"
        (close)="profileUser.set(null)" (message)="messageFromProfile($event)" />
      }
    </main>
  </div>
