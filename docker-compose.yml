# Huginn local development stack: API, web app, Postgres and pgAdmin.
name: huginn

services:
  api:
    build:
      context: ./api
      target: development
    command: npm run start:debug
    volumes:
      - ./api:/huginn/api
      - /huginn/api/node_modules
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://huginn:huginn@postgres:5432/huginn
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-only}
      PORT: 3000
    ports:
      - 3000:3000
      - 9229:9229

  web:
    build:
      context: ./web
      target: development
    command: npm run start -- --poll 1000
    volumes:
      - ./web:/huginn/web
      - /huginn/web/node_modules
    environment:
      API_URL: http://api:3000
    ports:
      - 4200:4200
    depends_on:
      - api

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: huginn
      POSTGRES_DB: huginn
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 35000:5432

  pgadmin:
    image: dpage/pgadmin4:9.18
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@huginn.localhost
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80

volumes:
  postgres-data:
