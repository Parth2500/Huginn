<div class="picker">
  <app-people-search labelledBy="people-label" placeholder="Search by username, e.g. ma" actionLabel="Add"
    [excludeIds]="excludeIds" [onlineIds]="onlineIds" [invalid]="invalid"
    (pick)="addUser.emit($event)" (pendingChange)="pendingChange.emit($event)">
    Type the start of a username. Matches appear as you type.
  </app-people-search>

  <ul class="chips" aria-label="People in this room">
    <li class="chip">
      <span class="avatar xs" [ngClass]="me.Id | tone">{{ me.username | initials }}</span>
      <span>{{ me.username }} <span class="you">(you)</span></span>
    </li>
    <li class="chip" *ngFor="let user of users; trackBy: trackUser">
      <span class="avatar xs" [ngClass]="user.Id | tone">{{ user.username | initials }}</span>
      <span>{{ user.username }}</span>
      <button type="button" class="remove" (click)="removeUserFromForm(user)" [attr.aria-label]="'Remove ' + user.username">
        <app-icon name="x"></app-icon>
      </button>
    </li>
  </ul>
</div>
