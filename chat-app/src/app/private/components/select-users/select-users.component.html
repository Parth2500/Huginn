<div class="picker">
  <app-people-search labelledBy="people-label" placeholder="Search people by name or username" actionLabel="Add"
    [excludeIds]="excludeIds" [onlineIds]="onlineIds" [invalid]="invalid"
    (pick)="addUser.emit($event)" (pendingChange)="pendingChange.emit($event)">
    Type any part of a name or username. Matches appear as you type.
  </app-people-search>

  <ul class="chips" aria-label="Members of this group">
    <li class="chip">
      <app-avatar [user]="me" size="xs"></app-avatar>
      <span>{{ me | displayName }} <span class="you">(you)</span></span>
    </li>
    <li class="chip" *ngFor="let user of users; trackBy: trackUser">
      <app-avatar [user]="user" size="xs"></app-avatar>
      <span>{{ user | displayName }}</span>
      <button type="button" class="remove" (click)="removeUserFromForm(user)" [attr.aria-label]="'Remove ' + (user | displayName)">
        <app-icon name="x"></app-icon>
      </button>
    </li>
  </ul>
</div>
