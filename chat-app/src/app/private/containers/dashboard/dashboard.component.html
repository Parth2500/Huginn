<div class="shell" [class.detail-open]="selectedRoom || creating || editingProfile"
  [class.empty-start]="rooms?.length === 0 && !creating && !selectedRoom && !editingProfile" [class.searching]="searching" *ngIf="{ online: onlineIds$ | async, connection: connection$ | async } as live">
  <aside class="sidebar" aria-label="Chats">
    <header class="side-head">
      <div class="brand">
        <span class="logo"><app-icon name="message"></app-icon></span>
        <span>ChatApp</span>
      </div>
      <button type="button" class="new-room" (click)="openCreate()" [class.active]="creating"
        [attr.aria-pressed]="creating">
        <app-icon name="users"></app-icon>
        <span>New group</span>
      </button>
    </header>

    <app-chat-search [rooms]="rooms" [me]="user" [onlineIds]="live.online" (activeChange)="searching = $event"
      (openRoom)="selectRoom($event)" (openPerson)="openPerson($event)"></app-chat-search>

    <div class="side-title" *ngIf="!searching">
      <h2>Chats</h2>
      <span class="count tabular" *ngIf="meta">{{ meta.totalItems }}</span>
    </div>

    <nav class="room-list" [hidden]="searching" aria-label="Chats">
      <!-- Loading -->
      <ul *ngIf="rooms === null" aria-busy="true" aria-label="Loading chats">
        <li *ngFor="let row of [1, 2, 3, 4]" class="room skeleton-row">
          <span class="avatar skeleton"></span>
          <span class="lines"><span class="skeleton l1"></span><span class="skeleton l2"></span></span>
        </li>
      </ul>

      <!-- Rooms -->
      <ul *ngIf="rooms && rooms.length > 0">
        <li *ngFor="let room of rooms; trackBy: trackRoom">
          <button type="button" class="room" (click)="selectRoom(room)"
            [class.active]="room.id === selectedRoom?.id && !creating"
            [class.fresh]="freshRoomIds.has(room.id!)"
            [class.has-unread]="unread.get(room.id!)"
            [attr.aria-current]="room.id === selectedRoom?.id && !creating ? 'true' : null"
            [attr.aria-label]="chatTitle(room) + (unread.get(room.id!) ? ', ' + unread.get(room.id!) + ' unread' : '')">
            <app-avatar *ngIf="directPartner(room) as person; else roomAvatar" [user]="person"
              [online]="!!live.online?.has(person.Id!)"></app-avatar>
            <ng-template #roomAvatar><span class="avatar" [ngClass]="room.id | tone">{{ room.name | initials }}</span></ng-template>
            <span class="lines">
              <span class="name-row">
                <span class="name">{{ chatTitle(room) }}</span>
                <time class="when" *ngIf="room.lastMessage" [attr.datetime]="room.lastMessage.created_at">{{ activityLabel(room) }}</time>
              </span>
              <span class="preview-row">
                <span class="preview" [class.empty]="!room.lastMessage">{{ preview(room) }}</span>
                <span class="badge tabular" *ngIf="unread.get(room.id!) as count"
                  [attr.aria-label]="count + ' unread'">{{ count > 99 ? '99+' : count }}</span>
              </span>
            </span>
          </button>
        </li>
      </ul>

      <!-- Empty -->
      <div class="side-empty" *ngIf="rooms && rooms.length === 0">
        <p class="title">No chats yet</p>
        <p>Search for someone above and send them a message. Chats people start with you appear here too.</p>
      </div>
    </nav>

    <div class="pager" *ngIf="meta && meta.totalPages > 1 && !searching">
      <button type="button" class="icon-btn" (click)="goToPage(meta.currentPage - 1)"
        [disabled]="meta.currentPage <= 0" aria-label="Previous page of chats">
        <app-icon name="chevron-left"></app-icon>
      </button>
      <span class="tabular">Page {{ meta.currentPage + 1 }} of {{ meta.totalPages }}</span>
      <button type="button" class="icon-btn" (click)="goToPage(meta.currentPage + 1)"
        [disabled]="meta.currentPage >= meta.totalPages - 1" aria-label="Next page of chats">
        <app-icon name="chevron-right"></app-icon>
      </button>
    </div>

    <footer class="me">
      <button type="button" class="me-button" (click)="openProfileEditor()" [class.active]="editingProfile"
        aria-label="Edit your profile" title="Edit your profile">
        <app-avatar [user]="user" size="sm" [online]="live.connection === 'online'"></app-avatar>
        <span class="who">
          <span class="username">{{ user | displayName }}</span>
          <span class="status" [attr.data-state]="live.connection" role="status">
            {{ live.connection === 'online' ? 'Online' : live.connection === 'connecting' ? 'Connecting…' : 'Offline, retrying' }}
          </span>
        </span>
      </button>
      <button type="button" class="icon-btn" (click)="logout()" aria-label="Sign out" title="Sign out">
        <app-icon name="log-out"></app-icon>
      </button>
    </footer>
  </aside>

  <main class="detail">
    <app-profile-edit *ngIf="editingProfile" [me]="user" (saved)="onProfileSaved($event)" (close)="closeProfileEditor()">
    </app-profile-edit>

    <app-create-room *ngIf="creating && !editingProfile" [me]="user" [onlineIds]="live.online"
      (created)="onCreated($event)" (cancel)="closeCreate()">
    </app-create-room>

    <app-chat-room *ngIf="!creating && !editingProfile && selectedRoom" [chatRoom]="selectedRoom" [me]="user"
      [onlineIds]="live.online" [connection]="live.connection ?? 'connecting'" (back)="closeRoom()"
      (openProfile)="openProfile($event)">
    </app-chat-room>

    <app-start-chat *ngIf="!creating && !editingProfile && !selectedRoom" [me]="user" [hasRooms]="!!rooms?.length"
      [onlineIds]="live.online" (pick)="openPerson($event)"></app-start-chat>

    <app-profile-panel *ngIf="profileUser" [person]="profileUser" [me]="user"
      [online]="!!live.online?.has(profileUser.Id!) || !!profileUser.online" [inChatWith]="isChatWith(profileUser)"
      (close)="profileUser = null" (message)="messageFromProfile($event)"></app-profile-panel>
  </main>
</div>
